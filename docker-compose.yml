name: oltinpay-app

services:
  oltinpay-api:
    build: ./oltinpay/oltinpay-api
    container_name: oltinpay-api
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  oltinpay-webapp:
    build:
      context: ./oltinpay/oltinpay-webapp
      args:
        NEXT_PUBLIC_API_URL: https://api.oltinpay.com/api/v1
    container_name: oltinpay-webapp
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    networks:
      - proxy
    depends_on:
      - oltinpay-api

  # Telegram bot is OFF by default (profile): cutover must not start new
  # moving parts. Conscious launch: docker compose --profile bot up -d
  oltinpay-bot:
    profiles: ["bot"]
    build: ./oltinpay/oltinpay-bot
    container_name: oltinpay-bot
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - WEBAPP_URL=https://app.oltinpay.com
    networks:
      - internal

networks:
  proxy:
    external: true
  internal:
    external: true
