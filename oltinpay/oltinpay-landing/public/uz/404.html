<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon.png">
<title>OltinPay — sahifa topilmadi</title>
<style>
  :root{--bg:#0b0d12;--panel:#141822;--line:#262c3a;--ink:#eef0f4;--sub:#9aa1b1;--gold:#e7b64c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:24px;text-align:center;background:
      radial-gradient(1000px 500px at 50% -10%, color-mix(in srgb,var(--gold) 10%,transparent), transparent 60%),var(--bg);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(150deg,var(--gold),#c9922f);
    display:grid;place-items:center;color:#161200;font-weight:800;font-size:24px}
  h1{font-size:22px;margin:6px 0 0;font-weight:700;letter-spacing:-.01em}
  p{color:var(--sub);margin:0;max-width:44ch;font-size:15px}
  .code{color:var(--gold);font-weight:800;font-size:15px;letter-spacing:.1em}
  a.btn{background:var(--gold);color:#161200;font-weight:700;padding:11px 18px;border-radius:11px;text-decoration:none;font-size:14px}
  a.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .homes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
</style>
</head>
<body>
  <span class="mark">O</span>
  <div class="code">404</div>
  <h1>Bunday sahifa yo'q</h1>
  <p>Havola eskirgan bo'lishi mumkin. Quyidan tilni tanlang va bosh sahifadan boshlang.</p>
  <!-- One 404 serves every language: Caddy has a single handle_errors and there is
       nothing to read a language from on a path that does not exist. So it offers
       all three ways home rather than stranding a visitor in a language they did
       not choose. -->
  <div class="homes">
    <a class="btn" href="/">English</a>
    <a class="btn ghost" href="/ru/">Русский</a>
    <a class="btn ghost" href="/uz/">O'zbekcha</a>
  </div>
</body>
</html>
