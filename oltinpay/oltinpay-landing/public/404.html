<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OltinPay — страница не найдена</title>
<style>
  :root{--bg:#0b0d12;--panel:#141822;--line:#262c3a;--ink:#eef0f4;--sub:#9aa1b1;--gold:#e7b64c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:24px;text-align:center;background:
      radial-gradient(1000px 500px at 50% -10%, color-mix(in srgb,var(--gold) 10%,transparent), transparent 60%),var(--bg);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(150deg,var(--gold),#c9922f);
    display:grid;place-items:center;color:#161200;font-weight:800;font-size:24px}
  h1{font-size:22px;margin:6px 0 0;font-weight:700;letter-spacing:-.01em}
  p{color:var(--sub);margin:0;max-width:44ch;font-size:15px}
  .code{color:var(--gold);font-weight:800;font-size:15px;letter-spacing:.1em}
  a.btn{margin-top:8px;background:var(--gold);color:#161200;font-weight:700;padding:11px 18px;border-radius:11px;text-decoration:none;font-size:14px}
</style>
</head>
<body>
  <span class="mark">O</span>
  <div class="code">404</div>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела. Вернитесь на главную — там всё, что нужно.</p>
  <a class="btn" href="/">На главную OltinPay</a>
</body>
</html>
